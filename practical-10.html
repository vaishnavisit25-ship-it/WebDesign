<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> vaishnavi satone (map)</title>
</head>
<body>
    <h2 align="center">Frame / iFrame Example</h2>
    <table border="1" width="100%" height="500px">
        <tr>
            <td width="50%">
                <h3 align="center">External Website</h3>
                <iframe src="https://www.wikipedia.org" width="100%" height="100%"></iframe>
            </td>
            <td width="50%">
                <h3 align="center">Google Map</h3>
                <iframe src="https://www.google.com/maps?q=Nagpur&output=embed"width="100%" height="100%"></iframe>
            </td>
        </tr>
    </table>
</body>
</html>
